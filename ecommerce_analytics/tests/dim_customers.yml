version: 2

models:
  - name: dim_customers
    description: "Customer dimension containing customer details and purchasing behavior."

    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - not_null
          - unique

      - name: customer_name
        data_tests:
          - not_null

      - name: customer_type
        description: "Classifies customers as New or Repeat."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['New', 'Repeat']