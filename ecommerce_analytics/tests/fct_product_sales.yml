
version: 2

models:
  - name: fct_product_sales
    description: "Product-level sales fact table containing sales metrics for each product."

    columns:
      - name: product_id
        description: "Unique identifier for each product."
        data_tests:
          - not_null
          - unique

      - name: total_units_sold
        description: "Total number of units sold for the product."
        data_tests:
          - not_null

      - name: total_sales_amount
        description: "Total sales amount generated by the product."
        data_tests:
          - not_null

      - name: total_order_items
        description: "Total number of order item records for the product."
        data_tests:
          - not_null

      - name: average_selling_price
        description: "Weighted average selling price per unit."
